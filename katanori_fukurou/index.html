<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>お店専用・肩乗りフクロウカメラ</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* スマホ縦長全画面にフィットさせるコンテナ */
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* カメラ映像を画面いっぱいに広げる（黒帯なし） */
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 自撮り用に反転 */
        }

        /* フクロウを描画する透明なキャンバス */
        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 10;
        }

        /* オシャレなシャッターボタン */
        #shutter-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 76px;
            height: 76px;
            background: rgba(255, 255, 255, 0.9);
            border: 6px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            outline: none;
        }
        #shutter-btn:active {
            background: rgba(200, 200, 200, 0.9);
            transform: translateX(-50%) scale(0.95);
        }

        /* 読み込み中の案内表示 */
        #loading {
            position: absolute;
            color: white;
            font-size: 16px;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 30px;
            z-index: 30;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="app-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
    <button id="shutter-btn" aria-label="写真を撮る"></button>
    <div id="loading">🦉 フクロウを呼んでいます...</div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('output_canvas');
const ctx = canvas.getContext('2d');
const loading = document.getElementById('loading');
const shutterBtn = document.getElementById('shutter-btn');

// --- 🦉 フクロウの画像をセットする設定 ---
const owlImg = new Image();
// ★ここにお店のフクロウ画像のURLを貼ります（現在はサンプル用のイラストです）
owlImg.src = 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&q=80&w=200'; 

let lastResults = null;

// 画面サイズに合わせてキャンバスの解像度を調整
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// MediaPipe Face Mesh（顔認識AI）の設定
const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

// 顔を検出したときのリアルタイム処理
faceMesh.onResults((results) => {
    loading.style.display = 'none'; // 準備できたら案内を消す
    lastResults = results;
    
    // キャンバスを一度きれいに消す
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        // 顔の左上の特徴点（インデックス：21番、左眉の上あたり）を取得
        const topLeftFace = landmarks[21];
        
        // 画面上の実際のピクセル位置に変換
        const x = (1 - topLeftFace.x) * canvas.width; // 反転考慮
        const y = topLeftFace.y * canvas.height;
        
        // 顔のサイズを計算して、フクロウの大きさを自動調整
        const chin = landmarks[152];
        const forehead = landmarks[10];
        const faceSize = Math.abs(chin.y - forehead.y) * canvas.height;
        
        const owlWidth = faceSize * 1.2;  // フクロウの横幅
        const owlHeight = faceSize * 1.2; // フクロウの縦幅
        
        // フクロウを人物の左肩（画面向かって右側、反転しているので左側へずらす）に配置
        // ここの数字を調整してベストな肩の位置へ移動させます
        const owlX = x - owlWidth * 1.3; 
        const owlY = y + owlHeight * 0.3;

        // フクロウを描画
        if (owlImg.complete) {
            ctx.drawImage(owlImg, owlX, owlY, owlWidth, owlHeight);
        }
    }
});

// カメラの起動設定
const camera = new Camera(video, {
    onFrame: async () => {
        await faceMesh.send({ image: video });
    },
    width: 1280,
    height: 720
});
camera.start().catch(err => {
    loading.innerText = "❌ カメラの起動に失敗しました。許可してください。";
});

// --- 📸 写真撮影＆スマホへの直接保存システム ---
shutterBtn.addEventListener('click', () => {
    // 合体写真用の隠しキャンバスを作成
    const saveCanvas = document.createElement('canvas');
    saveCanvas.width = canvas.width;
    saveCanvas.height = canvas.height;
    const saveCtx = saveCanvas.getContext('2d');

    // 1. カメラ映像を焼き付ける
    saveCtx.translate(saveCanvas.width, 0);
    saveCtx.scale(-1, 1); // 鏡像を直す
    saveCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);
    saveCtx.setTransform(1, 0, 0, 1, 0, 0); // 元に戻す

    // 2. その上からフクロウを焼き付ける（現在のキャンバスをそのままコピー）
    saveCtx.drawImage(canvas, 0, 0);

    // 3. スマホの写真フォルダへダウンロードさせる魔法
    const link = document.createElement('a');
    link.download = `fukuro_photo_${Date.now()}.png`;
    link.href = saveCanvas.toDataURL('image/png');
    link.click();
    
    // 撮影時のフラッシュ演出
    document.body.style.backgroundColor = '#fff';
    setTimeout(() => { document.body.style.backgroundColor = '#000'; }, 100);
});
</script>
</body>
</html>
