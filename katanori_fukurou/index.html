<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>森の中の・肩乗りフクロウカメラ</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* 🌲【背景canvas】人物の後ろに敷く */
        #bg_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* 一番後ろ */
        }

        /* 📸【修正1：人物最前面・ハッキリ表示】背景より手前に、100%の濃さで表示 */
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5; /* 背景の上、フクロウの下 */
            /* ⚠️【変更点】人物をハッキリ（1.0不透明度）させました！ */
            opacity: 1.0; /* 透けさせたい場合はここを0.3など適宜調整 */
        }
        video.mirror {
            transform: scaleX(-1); /* 自撮り用の鏡反転 */
        }

        /* 🦉【重ね順】人物の一番手前にフクロウ */
        canvas#output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 10; /* 最前面 */
        }

        /* 🔄 カメラ切り替えボタン */
        #switch-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #switch-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        #shutter-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 78px;
            height: 78px;
            background: rgba(255, 255, 255, 0.95);
            border: 6px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #loading {
            position: absolute;
            color: white;
            font-size: 15px;
            background: rgba(0,0,0,0.75);
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 30;
            pointer-events: none;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        #result-container {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 40;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #result-image {
            max-width: 100%;
            max-height: 72vh;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            object-fit: contain;
        }

        #result-msg {
            color: white;
            font-size: 15px;
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
        }

        #close-btn {
            margin-top: 20px;
            padding: 14px 36px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app-container">
    <canvas id="bg_canvas"></canvas> <video id="webcam" class="mirror" autoplay playsinline></video> <canvas id="output_canvas"></canvas> <button id="switch-btn" aria-label="カメラを切り替える">
        <svg viewBox="0 0 24 24">
            <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
        </svg>
    </button>

    <button id="shutter-btn" aria-label="写真を撮る"></button>
    <div id="loading">🦉 フクロウを呼んでいます...</div>
</div>

<div id="result-container">
    <img id="result-image" src="" alt="撮影された写真">
    <div id="result-msg">📷 写真を長押しして<br>「画像に保存」または「ダウンロード」をえらんでね！</div>
    <button id="close-btn">もう一度撮る</button>
</div>

<script>
const video = document.getElementById('webcam');
const bgCanvas = document.getElementById('bg_canvas');
const bgCtx = bgCanvas.getContext('2d');
const outputCanvas = document.getElementById('output_canvas');
const ctx = outputCanvas.getContext('2d');
const loading = document.getElementById('loading');
const shutterBtn = document.getElementById('shutter-btn');
const switchBtn = document.getElementById('switch-btn');
const resultContainer = document.getElementById('result-container');
const resultImage = document.getElementById('result-image');
const closeBtn = document.getElementById('close-btn');

// --- 🦉 フクロウ画像の名前を固定（owl_overlay.png） ---
const owlImg = new Image();
owlImg.src = 'owl_overlay.png'; 

const forestBgImg = new Image();
forestBgImg.src = 'forest_bg.jpg'; // ★森の背景画像

let currentFacingMode = 'user'; 
let activeCamera = null;

function resizeCanvas() {
    outputCanvas.width = window.innerWidth;
    outputCanvas.height = window.innerHeight;
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 4, 
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
    // 📸 安全装置：カメラさえ動けば文字を消して描画を開始する
    loading.style.display = 'none';
    ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
    
    // 【森の背景を描画】
    if (forestBgImg.complete && forestBgImg.naturalWidth !== 0) {
        bgCtx.drawImage(forestBgImg, 0, 0, bgCanvas.width, bgCanvas.height);
    } else {
        bgCtx.fillStyle = '#10291d'; 
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
    }

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        for (let i = 0; i < results.multiFaceLandmarks.length; i++) {
            const landmarks = results.multiFaceLandmarks[i];
            
            let anchorPoint = (currentFacingMode === 'user') ? landmarks[21] : landmarks[251]; 
            let x = (currentFacingMode === 'user') ? (1 - anchorPoint.x) * outputCanvas.width : anchorPoint.x * outputCanvas.width;
            const y = anchorPoint.y * outputCanvas.height;
            
            const chin = landmarks[152];
            const forehead = landmarks[10];
            const faceSize = Math.abs(chin.y - forehead.y) * outputCanvas.height;
            
            const owlWidth = faceSize * 1.3;  
            const owlHeight = faceSize * 1.3; 
            
            // 📐【修正2：フクロウの位置調整】肩から離しすぎず、ちょうどいい位置へ自動回り込み
            const owlX = x - owlWidth * 1.6; // 👈 左右の位置調整
            const owlY = y + owlHeight * 0.1; // 👈 上下の位置調整（0.1がちょうどいい深さ）

            // ⚠️ フクロウ画像に不備があっても全体をフリーズさせない安全装置
            if (owlImg.complete && owlImg.naturalWidth > 0) {
                ctx.drawImage(owlImg, owlX, owlY, owlWidth, owlHeight);
            }
        }
    }
});

function startCamera(facingMode) {
    loading.style.display = 'block';
    if (activeCamera) { activeCamera.stop(); }

    if (facingMode === 'user') {
        video.classList.add('mirror');
    } else {
        video.classList.remove('mirror');
    }

    activeCamera = new Camera(video, {
        onFrame: async () => { await faceMesh.send({ image: video }); },
        width: 1280,
        height: 720,
        facingMode: facingMode
    });

    activeCamera.start().catch(err => {
        loading.innerText = "❌ カメラのアクセスを許可してください（スマホの設定画面を確認）";
    });
}

// 🚀 AIの処理を待たずに、とにかく真っ先にカメラを強制起動する命令
startCamera(currentFacingMode);

switchBtn.addEventListener('click', () => {
    currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
    startCamera(currentFacingMode);
});

// --- 📸 写真撮影＆スマホ長押し保存システム（森の背景に合成！） ---
shutterBtn.addEventListener('click', () => {
    const saveCanvas = document.createElement('canvas');
    saveCanvas.width = outputCanvas.width;
    saveCanvas.height = outputCanvas.height;
    const saveCtx = saveCanvas.getContext('2d');

    // 1. まず森の背景を焼き付ける
    saveCtx.drawImage(bgCanvas, 0, 0);

    // 2. カメラ映像（人物）を背景の上に重ねて焼き付ける
    saveCtx.translate(saveCanvas.width, 0);
    saveCtx.scale(-1, 1); 
    // ⚠️【修正3：撮影時もハッキリ表示】人物の不透明度を100%にします
    saveCtx.globalAlpha = 1.0; // 人物をハッキリさせました！
    saveCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);
    saveCtx.globalAlpha = 1.0; // 透明度を元に戻す
    saveCtx.setTransform(1, 0, 0, 1, 0, 0); 

    // 3. その上からフクロウを焼き付ける
    saveCtx.drawImage(outputCanvas, 0, 0);

    resultImage.src = saveCanvas.toDataURL('image/png');
    resultContainer.style.display = 'flex';
});

closeBtn.addEventListener('click', () => {
    resultContainer.style.display = 'none';
});
</script>
</body>
</html>
